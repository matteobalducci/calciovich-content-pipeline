name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The runtime dependencies are not installed here on purpose: these are
        # unit tests over pure logic (registry state machine, planning, dedup)
        # and they must not need Google/Meta/TikTok SDKs or any credential.
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Byte-compile every module
        # Cheap guard against a syntax error reaching main in the scripts that
        # are not unit-tested yet.
        run: python -m compileall -q .
